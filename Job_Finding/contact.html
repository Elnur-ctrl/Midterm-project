<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Job Finding</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="container">
        <a class="logo" href="index.html">Job Finding</a>
        <nav>
                <a href="index.html">Home</a>
                <a href="jobs.html">Jobs</a>
                <a href="companies.html">Companies</a>
                <a href="about.html">About</a>
                <a class="active" href="contact.html">Contact</a>
        </nav>
    </header>
    <main class="container">
        <h1>Contact us</h1>
        <p>Ask about a job or leave your contact details.</p>
        <p>This is a demo form. It checks required fields but does not send messages.</p>
        <form action="contact.html" method="get">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>
            <label for="message">Message</label>
            <input id="message" name="message" type="text" required>
            <button class="btn btn-primary mt-3" type="submit">Check form</button>
        </form>
    </main>
    <footer class="text-center p-4">
        <p>Contact: <a href="mailto:hello@example.com">hello@example.com</a></p>
        <a href="https://www.instagram.com/">Instagram</a> | <a href="https://www.linkedin.com/">LinkedIn</a>
        <p>© 2026 Job Finding. Student project.</p>
    </footer>
</body>
</html>
